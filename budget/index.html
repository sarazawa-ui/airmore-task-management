<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="robots" content="noindex" />
    <title>Hittatsu へ移動中...</title>
    <script>
      // 旧・単独ページ（予実管理ボード）は統合アプリに移行済み。
      // ブックマークやブラウザの「戻る」で到達した場合も、履歴に残さず統合アプリへ転送する。
      (function () {
        var qs = window.location.search || "";
        window.location.replace("../" + qs + (window.location.hash || ""));
      })();
    </script>
  </head>
  <body>
    <p style="font-family: system-ui, sans-serif; padding: 24px">
      このページは Hittatsu の統合アプリに移動しました。
      <a href="../">こちらをクリック</a>してください。
    </p>
  </body>
</html>
