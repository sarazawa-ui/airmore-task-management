name: 得意先マスタの会社別の調査

# 得意先マスタが会社ごとに分かれているかを調べる(読むだけ。何も書かない)。
# 記録は公開されるため件数だけ。名前・コードの一覧は下の公開鍵で暗号化して出す(調査した Claude だけが読める)。
on:
  pull_request:
    paths:
      - "backup/diag-customers.js"
      - ".github/workflows/diag-customers.yml"
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 依存パッケージをインストール
        working-directory: backup
        run: npm install --no-audit --no-fund
      - name: 調べる(読むだけ)
        working-directory: backup
