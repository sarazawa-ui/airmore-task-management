name: 配信ファイルの検査

# PR とメインへの反映のたびに、本番で配信するファイルが壊れていないかを確かめる。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 配信ファイルを検査
        run: node .github/scripts/check-deploy.mjs
